[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vault"
version = "0.1.0"
description = "Local memory that follows you across every AI model and agent."
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.39.0",
    "pydantic==2.9.2",
    "typer==0.12.5",
    "mcp==1.0.0",
    "fastapi==0.115.4",
    "uvicorn==0.32.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.2",
]

[project.scripts]
vault = "vault.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
